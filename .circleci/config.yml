version: 2.1

# Independent fallback validation on Community branches and PRs. The primary
# seven-lane release gate remains .github/workflows/cpu-smoke.yml.
executors:
  python-node:
    docker:
      - image: cimg/python:3.11-node
    resource_class: small
    working_directory: ~/project

jobs:
  cpu-smoke:
    executor: python-node
    steps:
      - checkout
      - run:
          name: Install Community backend dependencies
          command: |
            cd backend
            python -m pip install -r requirements.txt pytest httpx
            python -m pip check
      - run:
          name: Compile and execute backend regressions
          command: |
            cd backend
            python -m compileall -q app scripts tests
            mkdir -p test-results
            python -m pytest -q tests --junitxml=test-results/classic.xml
      - store_test_results:
          path: backend/test-results

  source-boundary:
    executor: python-node
    steps:
      - checkout
      - run:
          name: Reject prohibited paths and scan tracked blobs
          command: |
            python scripts/check_edition_boundary.py
            python scripts/audit_publication.py
      - run:
          name: Test Community/Pro separation protections
          command: |
            python -m pip install 'pytest>=8,<10'
            python -m pytest -q backend/tests/test_edition_boundary.py backend/tests/test_publication_audit.py

  frontend-smoke:
    executor: python-node
    steps:
      - checkout
      - run:
          name: Validate browser JavaScript syntax
          command: |
            python - <<'PY'
            from pathlib import Path
            html = Path('frontend/index.html').read_text(encoding='utf-8')
            assert '<script>' in html and '</script>' in html
            Path('/tmp/lumqenix-browser.js').write_text(html.split('<script>', 1)[1].split('</script>', 1)[0])
            PY
            node --check /tmp/lumqenix-browser.js

  pretrained-model-check:
    executor: python-node
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install actual pretrained CPU runtime and verified model weights
          command: |
            cd backend
            python -m pip install -r requirements.txt pytest httpx
            python -m pip uninstall -y opencv-python-headless
            python -m pip install 'opencv-contrib-python-headless>=4.9,<5' 'onnxruntime>=1.18,<2' onnx
            python scripts/fetch_test_models.py --output-dir /tmp/lumqenix-models
      - run:
          name: Test actual pretrained model inference without mock weights
          command: |
            cd backend
            export LUMQENIX_FSRCNN_MODEL=/tmp/lumqenix-models/FSRCNN_x2.pb
            export LUMQENIX_ESPCN_MODEL=/tmp/lumqenix-models/ESPCN_x2.pb
            python -m pytest -q tests/test_real_models.py
      - run:
          name: Collect real model CPU latency and peak RSS
          command: |
            cd backend
            export LUMQENIX_FSRCNN_MODEL=/tmp/lumqenix-models/FSRCNN_x2.pb
            export LUMQENIX_ESPCN_MODEL=/tmp/lumqenix-models/ESPCN_x2.pb
            export OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=1
            python - <<'PY'
            import numpy as np
            from PIL import Image
            y, x = np.indices((128, 128))
            rgb = np.stack(((x * 7 + y * 3) % 256, (x * 2 + y * 11) % 256, (x + y * 5) % 256, (x + y * 5) % 256), -1).astype('uint8')
            Image.fromarray(rgb).save('/tmp/lumqenix-ci-input.png')
            PY
            python scripts/benchmark_models.py --input /tmp/lumqenix-ci-input.png --output-dir /tmp/lumqenix-ci-models --repeats 2 --require-models > pretrained-cpu-benchmark.json
            python - <<'PY'
            import json
            import math
            from pathlib import Path
            result = json.loads(Path('pretrained-cpu-benchmark.json').read_text())
            for model in ('fsrcnn', 'espcn'):
                row = result[model]
                assert row['status'] == 'ok', row
                assert row['max_rss_status'] == 'ok', row
                assert 0 < row['max_rss_bytes'] < 4 * 1024 ** 3, row
                assert len(row['warm_seconds']) == 2
                assert all(math.isfinite(x) and x > 0 for x in row['warm_seconds'])
            PY
      - store_artifacts:
          path: backend/pretrained-cpu-benchmark.json
          destination: pretrained-cpu-benchmark.json

workflows:
  community-fallback-ci:
    jobs:
      - cpu-smoke
      - source-boundary
      - frontend-smoke
      - pretrained-model-check
