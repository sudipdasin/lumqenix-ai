version: 2.1
jobs:
  linux-preview:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify Linux scripts and license
          command: |
            bash -n scripts/install-linux.sh
            bash -n scripts/run-linux.sh
            test -s LICENSE
      - run:
          name: Install actual FFmpeg video integration dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg libavcodec-extra
            command -v ffmpeg
            command -v ffprobe
            ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])libx264([[:space:]]|$)'
      - run:
          name: Install application and test dependencies
          command: |
            bash scripts/install-linux.sh
            .venv/bin/python -m pip install pytest httpx onnxruntime onnx
            .venv/bin/python -m pip uninstall -y opencv-python-headless
            .venv/bin/python -m pip install 'opencv-contrib-python-headless>=4.9,<5'
            .venv/bin/python -m pip check
      - run:
          name: Compile and execute backend regression tests
          command: |
            .venv/bin/python -m compileall -q backend/app backend/scripts backend/tests
            mkdir -p test-results
            cd backend
            ../.venv/bin/python -m pytest -q tests --junitxml=../test-results/pytest.xml
      - store_test_results:
          path: test-results
      - run:
          name: Verify version and application import
          command: |
            .venv/bin/python - <<'PY'
            import sys
            sys.path.insert(0, 'backend')
            from app.main import app
            from app.version import VERSION
            assert VERSION == '0.3.0-rc.4'
            assert app.title == 'Lumqenix API'
            PY
workflows:
  preview-validation:
    jobs:
      - linux-preview
