name: Community source boundary
on:
  push:
    branches: [main, 'development/**', 'preview/**']
  pull_request:
  workflow_dispatch:
jobs:
  edition-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject proprietary tracked paths
        run: python scripts/check_edition_boundary.py
      - name: Audit current tracked files for high-confidence leaks
        run: python scripts/audit_publication.py
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify boundary regression cases
        run: python -m pytest -q backend/tests/test_edition_boundary.py backend/tests/test_publication_audit.py
