name: CPU smoke tests
on:
  push:
    branches: [main, 'development/**', 'preview/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish verified RC2 prerelease only after all gates pass'
        type: boolean
        required: true
        default: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        neural: [false, true]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Install real-model test dependencies
        if: matrix.neural
        run: |
          python -m pip uninstall -y opencv-python-headless
          python -m pip install "opencv-contrib-python-headless>=4.9,<5" "onnxruntime>=1.18,<2" onnx
          python scripts/fetch_test_models.py --output-dir /tmp/lumqenix-models
      - name: Install FFmpeg with H.264 encoding support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libavcodec-extra
      - name: Verify real video integration prerequisites
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders | tee /tmp/lumqenix-encoders.txt
          grep -Eq '(^|[[:space:]])libx264([[:space:]]|$)' /tmp/lumqenix-encoders.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python
        run: python -m compileall -q app scripts tests
      - name: Run smoke tests
        run: |
          if [ "${{ matrix.neural }}" = "true" ]; then
            export LUMQENIX_FSRCNN_MODEL=/tmp/lumqenix-models/FSRCNN_x2.pb
            export LUMQENIX_ESPCN_MODEL=/tmp/lumqenix-models/ESPCN_x2.pb
          fi
          python -m pytest -q tests --junitxml=pytest-results.xml
      - name: Benchmark actual pretrained models in isolated CPU processes
        if: matrix.neural && matrix.python == '3.12'
        env:
          LUMQENIX_FSRCNN_MODEL: /tmp/lumqenix-models/FSRCNN_x2.pb
          LUMQENIX_ESPCN_MODEL: /tmp/lumqenix-models/ESPCN_x2.pb
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image
          y, x = np.indices((128, 128))
          pixels = np.stack(((x * 7 + y * 3) % 256, (x * 2 + y * 11) % 256, (x + y * 5) % 256), axis=-1).astype('uint8')
          Image.fromarray(pixels).save('/tmp/lumqenix-neural-input.png')
          PY
          python scripts/benchmark_models.py --input /tmp/lumqenix-neural-input.png --output-dir /tmp/lumqenix-neural-output --repeats 2 --require-models > pretrained-cpu-benchmark.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          data = json.loads(Path('pretrained-cpu-benchmark.json').read_text())
          for name in ('fsrcnn', 'espcn'):
              item = data[name]
              assert item['status'] == 'ok', (name, item)
              assert item['input_dimensions'] == [128, 128]
              assert item['output_dimensions'] == [256, 256]
              assert len(item['warm_seconds']) == 2
              assert len(item['model_sha256']) == 64
              assert item['max_rss_status'] == 'ok'
              assert 0 < item['max_rss_bytes'] < 4 * 1024**3
              assert all(math.isfinite(t) and t > 0 for t in item['warm_seconds'])
          PY
      - name: Measure real-model reconstruction fidelity against bicubic
        if: matrix.neural && matrix.python == '3.12'
        env:
          LUMQENIX_FSRCNN_MODEL: /tmp/lumqenix-models/FSRCNN_x2.pb
          LUMQENIX_ESPCN_MODEL: /tmp/lumqenix-models/ESPCN_x2.pb
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python scripts/benchmark_quality_models.py --output-dir /tmp/lumqenix-quality --repeats 2 --require-models > pretrained-quality.json
          python scripts/benchmark_quality_models.py --scene edges --output-dir /tmp/lumqenix-quality-edges --repeats 2 --require-models > pretrained-quality-edges.json
          python scripts/benchmark_quality_models.py --scene smooth --output-dir /tmp/lumqenix-quality-smooth --repeats 2 --require-models > pretrained-quality-smooth.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          data = json.loads(Path("pretrained-quality.json").read_text())
          assert data["reference_dimensions"] == [256, 256]
          assert data["low_resolution_dimensions"] == [128, 128]
          assert data["baseline_bicubic"]["mae_rgb"] > 0
          for name in ("fsrcnn", "espcn"):
              item = data["models"][name]
              assert item["execution"]["status"] == "ok", (name, item)
              quality = item["quality"]
              assert quality["dimensions"] == [256, 256]
              for key in ("prediction_metrics", "baseline_metrics"):
                  metrics = quality[key]
                  assert math.isfinite(metrics["mae_rgb"])
                  assert math.isfinite(metrics["mse_rgb"])
                  assert metrics["psnr_rgb_db"] is None or math.isfinite(metrics["psnr_rgb_db"])
          PY
      - name: Verify paired image evidence and record hashes
        if: matrix.neural && matrix.python == '3.12'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image
          base = Path('/tmp/lumqenix-quality')
          expected = {
              'reference-hr.png': (256, 256),
              'input-lr.png': (128, 128),
              'bicubic-2x.png': (256, 256),
              'models/fsrcnn-2x.png': (256, 256),
              'models/espcn-2x.png': (256, 256),
          }
          manifest = {'dataset': 'deterministic-synthetic-textures-v1', 'images': {}}
          for name, dimensions in expected.items():
              path = base / name
              data = path.read_bytes()
              assert data, f'Empty quality evidence: {name}'
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  assert image.size == dimensions, (name, image.size)
                  assert image.mode == 'RGB', (name, image.mode)
              manifest['images'][name] = {
                  'dimensions': list(dimensions),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'bytes': len(data),
              }
          Path('pretrained-quality-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Stage flat real-model quality reports and paired images
        if: matrix.neural && matrix.python == '3.12'
        run: |
          # Uploading both absolute /tmp and relative backend paths embeds
          # runner directories in ZIPs, breaking download-artifact release gates.
          mkdir -p release-quality-evidence/models
          cp pretrained-quality.json pretrained-quality-edges.json pretrained-quality-smooth.json pretrained-quality-manifest.json release-quality-evidence/
          cp /tmp/lumqenix-quality/reference-hr.png /tmp/lumqenix-quality/input-lr.png /tmp/lumqenix-quality/bicubic-2x.png release-quality-evidence/
          cp /tmp/lumqenix-quality/models/fsrcnn-2x.png /tmp/lumqenix-quality/models/espcn-2x.png release-quality-evidence/models/
      - name: Upload paired-reference pretrained quality evidence
        if: always() && matrix.neural && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: pretrained-quality-benchmark
          path: backend/release-quality-evidence/
          if-no-files-found: error
      - name: Upload pretrained CPU benchmark evidence
        if: always() && matrix.neural && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: pretrained-cpu-benchmark
          path: backend/pretrained-cpu-benchmark.json
          if-no-files-found: warn
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python }}-neural-${{ matrix.neural }}
          path: backend/pytest-results.xml
          if-no-files-found: warn

  frontend:
    name: Frontend syntax and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("frontend/index.html").read_text()
          assert "<script>" in html and "</script>" in html
          Path("/tmp/lumqenix-frontend.js").write_text(html.split("<script>", 1)[1].split("</script>", 1)[0])
          PY
          node --check /tmp/lumqenix-frontend.js

  video-integration:
    name: Real FFmpeg integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Install FFmpeg with H.264 encoding support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libavcodec-extra
      - name: Require FFmpeg with H.264 encoder
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders | tee /tmp/lumqenix-encoders.txt
          grep -Eq '(^|[[:space:]])libx264([[:space:]]|$)' /tmp/lumqenix-encoders.txt
      - name: Run real-video integration tests
        run: python -m pytest -q tests --junitxml=video-integration-results.xml
      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-video-integration
          path: backend/video-integration-results.xml
          if-no-files-found: error

  cpu-benchmark:
    name: CPU image API benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Measure real CPU endpoint and peak process RSS
        run: python scripts/benchmark_api_cpu.py --width 256 --height 256 --runs 3 --scale 2 > cpu-benchmark.json
      - name: Validate benchmark measurements and Lite memory budget
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          result = json.loads(Path("cpu-benchmark.json").read_text())
          assert result["input_pixels"] == 256 * 256
          assert result["output_pixels"] == 512 * 512
          assert result["warm_runs"] == 3
          assert result["encoded_png_bytes"] > 0
          assert result["output_format"] == "PNG"
          for key in ("warm_seconds_median", "warm_seconds_min", "warm_seconds_max", "peak_process_rss_mib"):
              assert math.isfinite(result[key]) and result[key] > 0, (key, result[key])
          assert result["warm_seconds_min"] <= result["warm_seconds_median"] <= result["warm_seconds_max"]
          assert result["peak_process_rss_mib"] < 4096, "Process exceeded 4 GiB memory budget"
          PY
      - name: Show benchmark results
        run: cat cpu-benchmark.json
      - name: Upload machine-readable benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-image-api-benchmark
          path: backend/cpu-benchmark.json
          if-no-files-found: error

  release-evidence:
    name: Cross-job real-model evidence gate
    needs: [test, frontend, video-integration, cpu-benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release evidence image decoder
        run: python -m pip install 'Pillow>=10,<13'
      - name: Retrieve actual benchmark artifacts from completed jobs
        uses: actions/download-artifact@v4
        with:
          pattern: '*benchmark*'
          merge-multiple: true
          path: /tmp/lumqenix-evidence
      - name: Reject missing, inconsistent, or over-budget evidence
        run: |
          python backend/scripts/validate_release_evidence.py \
            --performance /tmp/lumqenix-evidence/pretrained-cpu-benchmark.json \
            --quality /tmp/lumqenix-evidence/pretrained-quality.json \
            --quality-edges /tmp/lumqenix-evidence/pretrained-quality-edges.json \
            --quality-smooth /tmp/lumqenix-evidence/pretrained-quality-smooth.json \
            --api /tmp/lumqenix-evidence/cpu-benchmark.json \
            --manifest /tmp/lumqenix-evidence/pretrained-quality-manifest.json \
            --images-dir /tmp/lumqenix-evidence > release-evidence.json
          cat release-evidence.json
      - name: Preserve release evidence and six-model comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-gate
          path: release-evidence.json
          if-no-files-found: warn

  history-audit:
    name: Full reachable-history publication screen
    if: github.ref == 'refs/heads/preview/v0.3.0-rc.2-beta' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease == true))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete checkout and Community-only sources
        run: |
          git rev-parse --is-shallow-repository | grep -qx false
          python scripts/check_edition_boundary.py
      - name: Audit reachable Git object history for high-confidence publication hazards
        run: python scripts/audit_publication.py --history > history-audit.json
      - name: Retain audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-history-publication-audit
          path: history-audit.json
          if-no-files-found: warn

  publish-verified-prerelease:
    name: Publish verified Linux source prerelease (never stable)
    if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease == true && github.ref == 'refs/heads/preview/v0.3.0-rc.2-beta'
    needs: [test, frontend, video-integration, cpu-benchmark, release-evidence, history-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful Linux preview packaging for exactly this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          expected_sha = os.environ["GITHUB_SHA"]
          branch = "preview/v0.3.0-rc.2-beta"
          url = ("https://api.github.com/repos/" + repository +
                 "/actions/workflows/preview-package.yml/runs?branch=" +
                 urllib.parse.quote(branch, safe="") + "&event=push&per_page=30")
          for _ in range(36):
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=15) as response:
                  runs = json.load(response)["workflow_runs"]
              matching = [run for run in runs if run["head_sha"] == expected_sha]
              if matching and matching[0]["status"] == "completed":
                  if matching[0]["conclusion"] != "success":
                      raise SystemExit("Matching Linux preview packaging did not pass")
                  Path("/tmp/lumqenix-preview-run-id").write_text(str(matching[0]["id"]))
                  print("Matching Linux preview package passed:", matching[0]["id"])
                  break
              time.sleep(5)
          else:
              raise SystemExit("No successful matching Linux preview run: fail closed")
          PY
      - name: Retrieve and verify same-SHA source archive and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/lumqenix-release
          gh run download "$(cat /tmp/lumqenix-preview-run-id)" \
            --repo "$GITHUB_REPOSITORY" \
            --name lumqenix-community-v0.3.0-rc.2-linux-source \
            --dir /tmp/lumqenix-release
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name release-evidence-gate \
            --dir /tmp/lumqenix-release
          cd /tmp/lumqenix-release
          sha256sum -c lumqenix-community-v0.3.0-rc.2-source.zip.sha256
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path("/tmp/lumqenix-release")
          archive = root / "lumqenix-community-v0.3.0-rc.2-source.zip"
          assert archive.is_file() and archive.stat().st_size > 0
          with zipfile.ZipFile(archive) as package:
              invalid = [name for name in package.namelist()
                         if name.startswith("/") or ".." in PurePosixPath(name).parts]
              assert not invalid, "Unsafe source ZIP paths"
              entries = set(package.namelist())
              required = {"LICENSE", "backend/app/version.py", "backend/app/edition.py",
                          "frontend/index.html", "scripts/install-linux.sh",
                          "scripts/run-linux.sh"}
              assert required.issubset(entries), sorted(required - entries)
              assert 'VERSION = "0.3.0-rc.2"' in package.read("backend/app/version.py").decode()
              assert package.testzip() is None, "Source archive corrupted"
              assert not any(name.startswith(("pro_backend/", "pro_models/",
                                              "licensing/", "private/")) for name in entries)
          report = json.loads((root / "release-evidence.json").read_text())
          assert report.get("model_scene_combinations") == 6, report
          assert report.get("paired_images_verified") == 5, report
          print("Verified source ZIP, five image hashes, and six real-model scene comparisons")
          PY
      - name: Publish beta RC tag only (never stable or latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.0-rc.2
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing to overwrite"
            exit 1
          fi
          cat > /tmp/lumqenix-rc-notes.md <<'NOTES'
          ## Lumqenix Community v0.3.0-rc.2 — experimental Linux source preview

          Free open-source Community beta. Install the included source ZIP on
          Linux with Python 3.10+ using bash scripts/install-linux.sh, then
          launch locally using bash scripts/run-linux.sh. FFmpeg/ffprobe are
          required for video. No root install or automatic system service.

          Checks required on this exact commit: Python 3.10/3.12 (classic +
          actual pretrained FSRCNN/ESPCN), frontend, real FFmpeg, CPU process
          RSS, quality/manifest evidence, full reachable-history risk scan,
          and Linux installation/UI/API smoke. The attached JSON is the
          machine-checked benchmark summary.

          LIMITATIONS: Not a production/v1.0 stable release. Does not certify
          superiority to bicubic, photographic identity preservation, physical
          4 GB systems, all Linux distros, or third-party media/model rights.
          Optional pretrained model weights are not included. Local loopback
          only; do not expose the API publicly. Report problems in GitHub Issues.
          NOTES
          gh release create "$TAG" \
            /tmp/lumqenix-release/lumqenix-community-v0.3.0-rc.2-source.zip \
            /tmp/lumqenix-release/lumqenix-community-v0.3.0-rc.2-source.zip.sha256 \
            /tmp/lumqenix-release/release-evidence.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lumqenix Community v0.3.0-rc.2 — Linux beta preview" \
            --notes-file /tmp/lumqenix-rc-notes.md \
            --prerelease --latest=false
