name: CPU smoke tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Compile Python
        run: python -m compileall -q app scripts tests
      - name: Validate frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("../frontend/index.html").read_text()
          assert "<script>" in html and "</script>" in html
          Path("/tmp/lumqenix-frontend.js").write_text(html.split("<script>", 1)[1].split("</script>", 1)[0])
          PY
          node --check /tmp/lumqenix-frontend.js
      - name: Run smoke tests
        run: python -m pytest -q tests
