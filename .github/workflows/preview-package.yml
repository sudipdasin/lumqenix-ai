name: Community preview packaging smoke
# OWNER CI USAGE RESTRICTION (2026-11-25): NEVER trigger automatically.
on:
  workflow_dispatch:
    inputs:
      owner_approved:
        description: 'I explicitly approve GitHub Actions credits for this run'
        type: boolean
        required: true
        default: false
concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-preview:
    if: inputs.owner_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts and open-source license
        run: |
          bash -n scripts/install-linux.sh
          bash -n scripts/run-linux.sh
          bash -n scripts/launch-desktop.sh
          bash -n scripts/install-desktop.sh
          bash -n scripts/uninstall-desktop.sh
          python3 -m py_compile scripts/build-linux-installer.py scripts/build-deb.py
          bash -n scripts/run-deb.sh
          test -s LICENSE
          grep -q 'MIT License' LICENSE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source preview without root
        run: bash scripts/install-linux.sh
      - name: Install test tools
        run: |
          .venv/bin/python -m pip install pytest httpx onnxruntime onnx
          .venv/bin/python -m pip uninstall -y opencv-python-headless
          .venv/bin/python -m pip install 'opencv-contrib-python-headless>=4.9,<5'
          .venv/bin/python -m pip check
      - name: Run backend regression suite
        run: |
          cd backend
          ../.venv/bin/python -m pytest -q tests --junitxml=preview-pytest.xml
      - name: Validate backend dependencies and import
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python - <<'PY'
          import sys
          sys.path.insert(0, 'backend')
          from app.version import VERSION
          from app.main import app
          assert VERSION == '0.3.0-rc.6'
          assert app.title == 'Lumqenix API'
          PY
      - name: Smoke-test local API and UI startup
        run: |
          bash scripts/run-linux.sh > /tmp/lumqenix-preview.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          .venv/bin/python - <<'PY'
          import time
          import urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2) as api:
                      assert api.status == 200
                  with urllib.request.urlopen('http://127.0.0.1:8080', timeout=2) as ui:
                      assert ui.status == 200
                  print('Local beta UI and API are responding')
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('Beta startup smoke test failed')
          PY
      - name: Test real image enhancement response
        run: |
          .venv/bin/python - <<'PY'
          import io
          from PIL import Image
          import sys
          sys.path.insert(0, 'backend')
          from fastapi.testclient import TestClient
          from app.main import app
          image = Image.new('RGB', (16, 16), (120, 90, 70))
          buf = io.BytesIO()
          image.save(buf, format='PNG')
          with TestClient(app) as client:
              response = client.post('/api/enhance/image', data={'preset':'auto', 'scale':'2'}, files={'file':('test.png', buf.getvalue(), 'image/png')})
          assert response.status_code == 200, response.text[:400]
          with Image.open(io.BytesIO(response.content)) as output:
              assert output.format == 'PNG'
              assert output.size == (32, 32)
          PY
      - name: Verify installed application has no accidental public bind
        run: |
          ! grep -Eq -- '--host (0\\.0\\.0\\.0|::)' scripts/run-linux.sh
          ! grep -Eq -- '--bind (0\\.0\\.0\\.0|::)' scripts/run-linux.sh
      - name: Archive source preview for download
        run: |
          git archive --format=zip --output=/tmp/lumqenix-community-v0.3.0-rc.6-source.zip HEAD
          test -s /tmp/lumqenix-community-v0.3.0-rc.6-source.zip
      - name: Build and smoke-test verified Linux .run installer
        run: |
          python3 scripts/build-linux-installer.py \
            --source-zip /tmp/lumqenix-community-v0.3.0-rc.6-source.zip \
            --output /tmp/lumqenix-community-v0.3.0-rc.6-linux-installer.run \
            --version v0.3.0-rc.6
          /tmp/lumqenix-community-v0.3.0-rc.6-linux-installer.run \
            --extract-only --prefix "$RUNNER_TEMP/lumqenix-rc5-installer-check"
          test -s "$RUNNER_TEMP/lumqenix-rc5-installer-check/v0.3.0-rc.6/LICENSE"
          test -s "$RUNNER_TEMP/lumqenix-rc5-installer-check/v0.3.0-rc.6/scripts/run-linux.sh"
          if /tmp/lumqenix-community-v0.3.0-rc.6-linux-installer.run \
            --extract-only --prefix "$RUNNER_TEMP/lumqenix-rc5-installer-check"; then
            echo "::error::Installer unexpectedly overwrote existing version"
            exit 1
          fi
          (cd /tmp && sha256sum lumqenix-community-v0.3.0-rc.6-linux-installer.run > lumqenix-community-v0.3.0-rc.6-linux-installer.run.sha256)
          (cd /tmp && sha256sum -c lumqenix-community-v0.3.0-rc.6-linux-installer.run.sha256)
      - name: Build and install-test Ubuntu/Debian package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv python3-pip ffmpeg desktop-file-utils
          python3 scripts/build-deb.py \
            --source-zip /tmp/lumqenix-community-v0.3.0-rc.6-source.zip \
            --output /tmp/lumqenix-community_0.3.0~rc6-1_all.deb \
            --version v0.3.0-rc.6
          dpkg-deb --info /tmp/lumqenix-community_0.3.0~rc6-1_all.deb
          dpkg-deb --contents /tmp/lumqenix-community_0.3.0~rc6-1_all.deb
          dpkg-deb --extract /tmp/lumqenix-community_0.3.0~rc6-1_all.deb "$RUNNER_TEMP/lumqenix-deb-extracted"
          desktop-file-validate "$RUNNER_TEMP/lumqenix-deb-extracted/usr/share/applications/lumqenix-community.desktop"
          bash -n "$RUNNER_TEMP/lumqenix-deb-extracted/usr/bin/lumqenix-community"
          sudo dpkg -i /tmp/lumqenix-community_0.3.0~rc6-1_all.deb
          dpkg -s lumqenix-community
          command -v lumqenix-community
          lumqenix-community --version | grep -F 'v0.3.0-rc.6'
          lumqenix-community --doctor
          sudo dpkg -r lumqenix-community
          test ! -e /usr/bin/lumqenix-community
          (cd /tmp && sha256sum lumqenix-community_0.3.0~rc6-1_all.deb > lumqenix-community_0.3.0~rc6-1_all.deb.sha256)
          (cd /tmp && sha256sum -c lumqenix-community_0.3.0~rc6-1_all.deb.sha256)
      - name: Generate and verify source ZIP checksum
        run: |
          cd /tmp
          sha256sum lumqenix-community-v0.3.0-rc.6-source.zip > lumqenix-community-v0.3.0-rc.6-source.zip.sha256
          sha256sum -c lumqenix-community-v0.3.0-rc.6-source.zip.sha256
          unzip -t lumqenix-community-v0.3.0-rc.6-source.zip
      - name: Upload beta regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumqenix-beta-pytest-results
          path: backend/preview-pytest.xml
          if-no-files-found: warn
      - name: Upload source preview ZIP (not a certified release)
        uses: actions/upload-artifact@v4
        with:
          name: lumqenix-community-v0.3.0-rc.6-linux-source
          path: |
            /tmp/lumqenix-community-v0.3.0-rc.6-source.zip
            /tmp/lumqenix-community-v0.3.0-rc.6-source.zip.sha256
            /tmp/lumqenix-community-v0.3.0-rc.6-linux-installer.run
            /tmp/lumqenix-community-v0.3.0-rc.6-linux-installer.run.sha256
            /tmp/lumqenix-community_0.3.0~rc6-1_all.deb
            /tmp/lumqenix-community_0.3.0~rc6-1_all.deb.sha256
          if-no-files-found: error
