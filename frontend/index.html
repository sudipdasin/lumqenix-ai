<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumqenix Studio</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8eaf5;background:#0b1020}body{max-width:900px;margin:60px auto;padding:0 20px}h1{font-size:2.5rem;margin-bottom:0}p{color:#aab3cc}.panel{background:#151d32;border:1px solid #2a3858;border-radius:18px;padding:28px;margin-top:25px}label{display:block;margin:16px 0 6px}select,input,button{font:inherit}select,input[type=file]{width:100%;padding:12px;background:#0e1528;color:white;border:1px solid #3c4a68;border-radius:9px;box-sizing:border-box}button{background:#8177ff;color:white;border:0;border-radius:10px;padding:13px 20px;margin-top:22px;cursor:pointer}button:disabled{opacity:.5}#preview{max-width:100%;max-height:430px;border-radius:10px;margin-top:20px}small{color:#8c96b0}</style></head><body>
<h1 id="brand">Lumqenix Studio</h1><p id="tagline">Restore brilliance. Reveal every detail.</p><div class="panel"><h2>Enhance your media</h2><label>Choose image or video</label><input id="file" type="file" accept="image/*,video/*"><label>Enhancement preset</label><select id="preset"><option value="auto">Auto</option><option value="natural">Natural</option><option value="vivid">Vivid</option><option value="restore">Restore</option><option value="cinematic">Cinematic</option></select><label>Upscale</label><select id="scale"><option value="1">1× (enhance only)</option><option value="2" selected>2×</option><option value="4">4×</option></select><button id="go">Enhance & download</button><p id="status" role="status"></p><img id="preview" hidden alt="Enhanced image preview"><p><small>Version 0.1: CPU baseline using traditional filters and Lanczos resizing. Not neural super-resolution or true HDR.</small></p></div>
<script>
const $=id=>document.getElementById(id);fetch('http://localhost:8000/api/brand').then(r=>r.json()).then(b=>{$('brand').textContent=b.studio;$('tagline').textContent=b.tagline}).catch(()=>{});
$('go').onclick=async()=>{const file=$('file').files[0];if(!file){$('status').textContent='Select a file first.';return;}const isVideo=file.type.startsWith('video/');const body=new FormData();body.append('file',file);body.append('preset',$('preset').value);body.append('scale',$('scale').value);$('go').disabled=true;$('status').textContent='Processing…';try{const response=await fetch('http://localhost:8000/api/enhance/'+(isVideo?'video':'image'),{method:'POST',body});if(!response.ok)throw Error((await response.json()).detail||'Processing failed');const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=isVideo?'enhanced.mp4':'enhanced.png';a.click();if(!isVideo){$('preview').src=url;$('preview').hidden=false}else{URL.revokeObjectURL(url)}$('status').textContent='Complete. Your download should start automatically.'}catch(e){$('status').textContent=e.message}finally{$('go').disabled=false}};
</script></body></html>
